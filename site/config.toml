base_url = "https://hupe1980.github.io/bergman"
title = "Bergman"
description = "A Rust-native maintenance engine for Apache Iceberg. Policy-driven snapshot expiration, orphan cleanup and compaction planning — one crate, one binary, no JVM."
default_language = "en"
author = "hupe1980"

compile_sass = true
build_search_index = true
generate_feeds = true
feed_filenames = ["atom.xml"]

# Every page is written as one document; `taxonomies` would add index pages
# nobody links to.
taxonomies = []

[markdown]
render_emoji = false
external_links_target_blank = true
external_links_no_referrer = true
smart_punctuation = false
bottom_footnotes = true
# GitHub-style `> [!NOTE]` callouts, so a warning in the source renders as one.
github_alerts = true

[markdown.highlighting]
# `css` emits classes rather than inline colours, so one highlighted block can
# follow the reader's light/dark preference like everything else on the page.
style = "class"
light_theme = "ayu-light"
dark_theme = "ayu-dark"
add_color_scheme = true

[search]
# The JavaScript form assigns `window.searchIndex`, so the page needs no fetch
# and search keeps working from a `file://` preview.
index_format = "elasticlunr_javascript"
include_title = true
include_description = true
include_path = true
include_content = true

[extra]
repo = "https://github.com/hupe1980/bergman"
repo_name = "hupe1980/bergman"
license = "Apache-2.0 OR MIT"

# The one-line claim the whole site is arranged around.
tagline = "Iceberg maintenance without the JVM"

# Order of the documentation sidebar. Pages carry `weight`, and the groups here
# name which weights belong together.
[[extra.nav]]
title = "Start here"
pages = ["getting-started", "status"]

[[extra.nav]]
title = "Configure"
pages = ["policies", "configuration"]

[[extra.nav]]
title = "Operations"
pages = ["snapshots", "orphans", "compaction"]

[[extra.nav]]
title = "Run it"
pages = ["library", "operating"]

[[extra.nav]]
title = "Reference"
pages = ["architecture", "rustberg"]
