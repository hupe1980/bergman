# Bergman configuration.
#
# Every setting is optional. What a policy does not state falls through to the
# table's own Iceberg properties, and then to the Iceberg specification
# default — so this file says only what differs from what the tables already
# declare. `bergman policy explain <table>` prints the resolved result together
# with the origin of every value.
#
# Validate offline (no catalog, no credentials — suitable for CI):
#
#     bergman policy lint

# ---------------------------------------------------------------------------
# Catalogs
# ---------------------------------------------------------------------------

[[catalogs]]
# The name is the first segment of every table reference, and therefore what
# rule patterns match against. It may not contain a dot.
name = "prod"

# The only protocol implemented. It reaches every catalog Bergman targets:
# Rustberg, Polaris, Lakekeeper, Nessie, Unity.
kind = "rest"

uri = "http://localhost:8181/catalog"

# The warehouse, when the catalog serves several. Also used to check at startup
# that this build carries the right object-store feature.
warehouse = "s3://lake/warehouse"

# The *name* of the environment variable holding the bearer token. Never the
# token: a credential in a config file is a credential in version control.
# token_env = "BERGMAN_CATALOG_TOKEN"
#
# For OAuth2 instead, set `credential` in [catalogs.properties] below. Bergman
# reads the same auth properties the Iceberg REST client does, so one
# configuration authenticates both the read path and the commit path — and it
# renews the token before it expires, which matters for a long-lived daemon.

# Restrict discovery to these namespaces instead of walking the whole catalog.
# Nested namespaces are dotted, as in rule patterns. On a large catalog this
# turns an O(catalog) tree walk into an O(subtree) one.
# namespaces = ["analytics", "streaming.raw"]

# Storage configuration, using Iceberg's own property names — so `s3.endpoint`
# means here what it means in Spark, Trino, and PyIceberg. These reach both the
# catalog's file client and the object-store client orphan scanning needs.
[catalogs.properties]
"s3.region" = "eu-central-1"
# "s3.endpoint"          = "http://minio:9000"
# "s3.path-style-access" = "true"          # MinIO and most S3-compatible stores
#
# Credentials are best left to the provider chain (instance role, workload
# identity, `aws configure`) or vended by the catalog. Set them here only if
# there is no alternative:
# "s3.access-key-id"     = "..."
# "s3.secret-access-key" = "..."
#
# OAuth2 client credentials, as every Iceberg client spells them. The token
# endpoint defaults to `{uri}/v1/oauth/tokens` and the scope to `catalog`.
# "credential"        = "svc-bergman:${SECRET}"
# "oauth2-server-uri" = "https://idp.example.com/oauth/token"
# "scope"             = "catalog"

# ---------------------------------------------------------------------------
# Defaults — layered under every rule that does not override them
# ---------------------------------------------------------------------------

[defaults.snapshots]
# Falls back to the table's `history.expire.max-snapshot-age-ms`, then to the
# Iceberg default of 5 days.
max_age = "7d"

# Falls back to `history.expire.min-snapshots-to-keep`, then to 1.
min_to_keep = 3

# Delete the files expiration orphans. Off by default: with it off, expiration
# is a pure metadata operation and the orphan scanner reclaims the files later
# — one deleter, one safety model. Turning it on reclaims storage immediately,
# without waiting out the orphan grace period.
# delete_files = true

[defaults.orphans]
# The scanner is off unless a rule enables it.
# enabled = true

# "dry-run" reports; "delete" removes. Deleting is opt-in, and deliberately so:
# this is the one operation that can destroy a healthy table.
mode = "dry-run"

# Only consider files older than this. Bounded below by a hard 24-hour floor
# that cannot be configured away — writers stage files before the commit that
# references them, so a young unreferenced file is more likely a live write
# than garbage.
older_than = "7d"

# The shortest gap between two scans of one table. This is the only operation
# that is *scheduled* rather than triggered: every other one decides from
# metadata Bergman has already read, while this one cannot know whether a table
# has orphans without listing its whole location — and that listing is the cost.
#
# Applies within one process. A one-shot `bergman run` always scans, because the
# cron entry that invoked it already decided the cadence.
min_interval = "24h"

[defaults.compaction]
# Compaction rewrites data, so it never arrives by accident.
#
# Files are read with their delete files applied and written back at the target
# size, and a delete file is retired only when every data file it applies to is
# inside the group being rewritten.
# enabled = true

# Falls back to the table's `write.target-file-size-bytes`, then to 512 MiB.
# target_file_size = 536870912


# The executor's memory pool for one file group.
#
# A real budget rather than an estimate: the two operators that can want more
# than a batch at a time — the global sort, and the hash anti-join that applies
# equality deletes — spill to disk when they reach it rather than failing.
# max_sort_memory = 1073741824   # 1 GiB

# A partition is not a unit of work. Its eligible files are bin-packed into
# groups bounded by these two, and each group commits on its own — so one lost
# commit costs one group rather than a whole partition, and a partition larger
# than memory is still compactable.
#
# The equivalent of Spark's `max-file-group-size-bytes`, sized for one process
# rather than a cluster.
# max_group_bytes  = 8589934592   # 8 GiB
# max_input_files  = 10000


[defaults.compaction.trigger]
# Compaction is *triggered*, not scheduled: a table already at target size
# costs one metadata read per cycle and no data I/O at all.

# Rewrite when this fraction of a partition's files are below the small-file
# threshold (`min_file_size_ratio` of the target size).
small_file_ratio = 0.3

# Never rewrite fewer than this many files. Matches Spark's
# `rewrite_data_files` default, so behaviour is unsurprising.
min_input_files = 5

# Rewrite when delete records exceed this fraction of a partition's rows, even
# when file sizes are fine. This is the trigger that matters for streaming and
# CDC targets, where read amplification comes from delete files rather than
# from small ones.
delete_ratio = 0.1

# What counts as "small", as a fraction of the target file size.
min_file_size_ratio = 0.75

# Leave a partition alone until its newest file is this old.
#
# The guard against fighting the writer for the hot partition. A streaming
# target commits to one partition continuously, and a rewrite of that partition
# loses its compare-and-swap to the very next micro-batch — having already spent
# a full read and write of the data. Waiting is strictly cheaper than competing.
min_file_age = "1h"

[defaults.manifests]
# Pure metadata: the same manifest entries re-packed into fewer, larger files.
# No data file is read or written. The cheapest real win available.
# rewrite = true

# Falls back to `commit.manifest.target-size-bytes`, then to 8 MiB.
# target_size = 8388608

# ---------------------------------------------------------------------------
# Rules — evaluated in order, first match wins
# ---------------------------------------------------------------------------
#
# Patterns are globs over `catalog.namespace....table` with `.` as the
# separator. `*` stops at a namespace boundary, `**` crosses it:
#
#   prod.analytics.*    matches prod.analytics.events
#                       but NOT  prod.analytics.web.events
#   prod.analytics.**   matches both

[[rules]]
match = "prod.analytics.*"

# A streaming target: files are the right size, but equality deletes amplify
# every read. Evaluate often and trigger on the delete ratio rather than on
# file sizes.
[[rules]]
match = "prod.streaming.events_*"
# `schedule` governs when evaluation runs, not whether anything executes —
# the health analyzer decides that.
schedule = "0 */2 * * *"

[rules.compaction]
enabled = true
# Rows are sorted globally within each file group, so output files carry tight
# min/max bounds and a query filtering on these columns can skip whole files.
# The sort spills at `max_sort_memory`, so a large group is sorted rather than
# refused.
#
# Only needed for a table that declares no sort order of its own: where the
# table has one, Bergman honours it — direction and null placement included —
# without being asked, because a rewrite that bin-packed a sorted table back
# together unsorted would destroy a layout its owner configured. A rule
# overrides the table; this one does.
#
# Direction is deliberately not expressible here. It belongs on the table's
# `sort-order`, where every other Iceberg tool reads it.
sort = ["event_date", "customer_id"]

[rules.compaction.trigger]
delete_ratio = 0.05
# A busy streamer needs a longer settle time than the default, or every cycle
# picks the partition it is actively writing.
min_file_age = "2h"

# Scratch tables: excluded on purpose. An explicit exclusion is reported as
# "skipped", where a table no rule matches is reported as "unmatched" — so a
# pattern that does not do what you thought is visible.
[[rules]]
match = "prod.tmp.**"
skip = true

# ---------------------------------------------------------------------------
# Global limits
# ---------------------------------------------------------------------------

[limits]
# How many tables are examined and maintained concurrently.
max_parallel_tables = 4

# Ceiling on bytes read by rewrites in one cycle. When the budget cannot cover
# everything, tables are ordered most-fragmented-first and the remainder is
# reported as deferred — never silently dropped.
#
# Charged per *operation*, not per table: metadata-only work reads no data files
# and costs the budget nothing, so a rewrite ceiling cannot block snapshot
# expiration — not even on the table whose compaction exhausted it.
# max_rewrite_bytes_per_run = 536870912000   # 500 GiB

# Never delete more than this many files in one operation. A ceiling on the
# blast radius if reasoning about what is dead is ever wrong: the difference
# between losing a thousand files and losing a million.
#
# It lives here rather than under [orphans] because it applies to *every*
# deletion Bergman performs — orphan removal and snapshot-expiration cleanup
# alike, which share one deleter and therefore one safety model. Nothing is lost
# by hitting it: what is withheld is reported and reclaimed by the next pass.
max_deletes_per_run = 100000

# Only begin work inside this window. A cycle already under way runs to
# completion — stopping mid-rewrite would leave files written and uncommitted.
#
# The timezone is mandatory: a window in local time moves when a replica is
# scheduled in another region, and "not during business hours" must not move.
# maintenance_window = "22:00-06:00 Europe/Berlin"
