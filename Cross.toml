# Build images for the musl release targets.
#
# `cross` compiles build scripts and proc macros for the *host* triple and runs
# them inside the container, against the container's glibc. Its last release
# (0.2.5, 2023) still ships an Ubuntu 18.04 image for aarch64 — glibc 2.27 —
# while a current Rust toolchain emits host binaries needing 2.28, 2.29 and
# 2.30. The build then fails on the first crate with a build script, which is
# `libc`, and says so in terms that look like a broken container rather than a
# stale one:
#
#     build-script-build: /lib/x86_64-linux-gnu/libc.so.6:
#       version `GLIBC_2.28' not found
#
# The `main` images are the upstream answer, and they are Ubuntu 24.04.
#
# Only aarch64 is actually stale — 0.2.5's x86_64 image is Ubuntu 20.04 and has
# glibc 2.31, which is enough today — but both are pinned here so the two Linux
# artifacts are built the same way, and so the next time Rust raises its floor
# it does not take one target down on its own.
#
# `main` is a moving tag, which is the trade this makes. It does not reach the
# artifact: the output is statically linked against musl, and the Rust and C
# dependencies are pinned by `Cargo.lock` and built with `--locked`. What moves
# is the toolchain that compiles them. Pin `name@sha256:…` instead if that is
# not good enough for a given release.

[target.x86_64-unknown-linux-musl]
image = "ghcr.io/cross-rs/x86_64-unknown-linux-musl:main"

[target.aarch64-unknown-linux-musl]
image = "ghcr.io/cross-rs/aarch64-unknown-linux-musl:main"
