name: CI

on:
  push:
    branches: [main]
  pull_request:

env:
  CARGO_TERM_COLOR: always
  RUST_BACKTRACE: 1

jobs:
  lint:
    name: Format and lint
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v5
      - uses: dtolnay/rust-toolchain@stable
        with:
          components: rustfmt, clippy
      - uses: Swatinem/rust-cache@v2
      - run: cargo fmt --all -- --check
      - run: cargo clippy --all-features --all-targets -- -D warnings

  test:
    name: Test (${{ matrix.os }})
    runs-on: ${{ matrix.os }}
    strategy:
      fail-fast: false
      matrix:
        # The test suite needs no containers and no cloud credentials — local
        # filesystem and in-memory storage are always compiled in — which is
        # what makes running it on three platforms cheap enough to be routine.
        os: [ubuntu-latest, macos-latest, windows-latest]
    steps:
      - uses: actions/checkout@v5

      # DataFusion, Arrow, Parquet and aws-lc link statically into the library,
      # the binary and each of a dozen integration-test binaries, so this job
      # writes several gigabytes even with debug info trimmed (see
      # `[profile.dev]` in Cargo.toml). A runner that fills up does not report a
      # full disk — the linker mmaps its output, the filesystem cannot back the
      # pages, and `rust-lld` dies with SIGBUS and an LLVM stack dump that reads
      # like a compiler bug. The preinstalled SDKs nothing here uses are worth
      # ~25 GB.
      - name: Reclaim runner disk
        if: runner.os == 'Linux'
        run: |
          sudo rm -rf /usr/share/dotnet /usr/local/lib/android \
                      /opt/ghc /opt/hostedtoolcache/CodeQL
          df -h /

      - uses: dtolnay/rust-toolchain@stable
      - uses: Swatinem/rust-cache@v2
      - run: cargo test --all-features

  features:
    name: Feature matrix
    runs-on: ubuntu-latest

    # Warnings are errors here, not only under `--all-features`. The lint job
    # runs clippy against the full build, so a warning that exists *only* in a
    # narrower one — code left dead when a feature is off, most often — is
    # invisible to every other job in this file.
    env:
      RUSTFLAGS: -D warnings

    steps:
      - uses: actions/checkout@v5
      - uses: dtolnay/rust-toolchain@stable
      - uses: Swatinem/rust-cache@v2

      - name: No features
        run: cargo check --no-default-features

      - name: All features
        run: cargo check --all-features

      # The check that earns its runtime. A feature that compiles under
      # `--all-features` can be broken on its own, because another crate's
      # feature unification was quietly switching on what it needed. That
      # failure appears in this build and nowhere else.
      - name: Each feature alone
        run: |
          for feature in cli catalog-rest compaction storage-s3 storage-gcs storage-azure metrics; do
            echo "::group::$feature"
            cargo check --no-default-features --features "$feature"
            echo "::endgroup::"
          done

  msrv:
    name: MSRV
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v5
      - name: Read rust-version from Cargo.toml
        id: msrv
        run: echo "version=$(grep '^rust-version' Cargo.toml | cut -d'"' -f2)" >> "$GITHUB_OUTPUT"
      - uses: dtolnay/rust-toolchain@master
        with:
          toolchain: ${{ steps.msrv.outputs.version }}
      - uses: Swatinem/rust-cache@v2
      # The declared MSRV is checked against a real toolchain rather than
      # trusted: the number in Cargo.toml is a claim until something compiles
      # with it.
      - run: cargo check --all-features

  # Advisories, licences, bans and sources. Not a nice-to-have: the tree is
  # rustls-only on purpose — a native-tls dependency creeping in would make the
  # static musl build stop being static — and nothing but this notices.
  #
  # Every ignored advisory in `deny.toml` carries a written reason. One with no
  # argument is a suppressed alarm, and this job is what makes somebody write
  # the argument down.
  deny:
    name: Advisories and licences
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v5
      - uses: EmbarkStudios/cargo-deny-action@v2
        with:
          command: check

  # The documentation is part of the deliverable, and a broken internal link is
  # a promise it cannot keep. `zola check` catches those; external links are not
  # checked in CI, because a third-party site being down is not a reason to fail
  # a pull request.
  site:
    name: Documentation site
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v5
      - uses: taiki-e/install-action@v2
        with:
          tool: zola
      - run: zola --root site check --skip-external-links

  docs:
    name: Documentation
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v5
      - uses: dtolnay/rust-toolchain@stable
      - uses: Swatinem/rust-cache@v2
      # A broken intra-doc link is a promise the documentation makes and
      # cannot keep.
      - run: cargo doc --all-features --no-deps
        env:
          RUSTDOCFLAGS: -D warnings

  portability:
    name: Build (${{ matrix.target }})
    runs-on: ubuntu-latest
    strategy:
      fail-fast: false
      matrix:
        target:
          # musl targets are the ones releases publish: statically linked, no
          # glibc version to match against the host.
          - x86_64-unknown-linux-musl
          - aarch64-unknown-linux-musl
    steps:
      - uses: actions/checkout@v5
      - uses: dtolnay/rust-toolchain@stable
        with:
          targets: ${{ matrix.target }}
      - uses: Swatinem/rust-cache@v2
      - uses: taiki-e/install-action@cross
      - run: cross build --release --target ${{ matrix.target }} --all-features
