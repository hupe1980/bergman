name: Release

# Binaries and a container image, built from a tag.
#
# The musl targets are what releases publish: statically linked, so there is no
# glibc version on the host to match and the same artifact runs on anything.

on:
  push:
    tags: ["v*"]
  workflow_dispatch:

permissions:
  contents: write
  packages: write

env:
  CARGO_TERM_COLOR: always

jobs:
  binaries:
    name: ${{ matrix.target }}
    runs-on: ${{ matrix.os }}
    strategy:
      fail-fast: false
      matrix:
        include:
          - { target: x86_64-unknown-linux-musl, os: ubuntu-latest, cross: true }
          - { target: aarch64-unknown-linux-musl, os: ubuntu-latest, cross: true }
          - { target: x86_64-apple-darwin, os: macos-latest, cross: false }
          - { target: aarch64-apple-darwin, os: macos-latest, cross: false }
          - { target: x86_64-pc-windows-msvc, os: windows-latest, cross: false }
    steps:
      - uses: actions/checkout@v5
      - uses: dtolnay/rust-toolchain@stable
        with:
          targets: ${{ matrix.target }}
      - uses: Swatinem/rust-cache@v2

      - uses: taiki-e/install-action@cross
        if: matrix.cross

      - name: Build
        shell: bash
        run: |
          # `--locked` so a release is built from exactly the dependency
          # versions CI tested, not whatever resolved today.
          if [ "${{ matrix.cross }}" = "true" ]; then
            cross build --release --locked --target ${{ matrix.target }} --all-features
          else
            cargo build --release --locked --target ${{ matrix.target }} --all-features
          fi

      - name: Package
        shell: bash
        run: |
          name="bergman-${{ github.ref_name }}-${{ matrix.target }}"
          mkdir "$name"
          if [ -f "target/${{ matrix.target }}/release/bergman.exe" ]; then
            cp "target/${{ matrix.target }}/release/bergman.exe" "$name/"
          else
            cp "target/${{ matrix.target }}/release/bergman" "$name/"
          fi
          cp README.md LICENSE-APACHE LICENSE-MIT bergman.example.toml "$name/"
          tar czf "$name.tar.gz" "$name"
          # A checksum beside each archive, so a download can be verified
          # without trusting the transport.
          shasum -a 256 "$name.tar.gz" > "$name.tar.gz.sha256"

      - uses: actions/upload-artifact@v4
        with:
          name: bergman-${{ matrix.target }}
          path: |
            *.tar.gz
            *.tar.gz.sha256

  image:
    name: Container image
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v5
      - uses: docker/setup-qemu-action@v3
      - uses: docker/setup-buildx-action@v3

      - uses: docker/login-action@v3
        with:
          registry: ghcr.io
          username: ${{ github.actor }}
          password: ${{ secrets.GITHUB_TOKEN }}

      - id: meta
        uses: docker/metadata-action@v5
        with:
          images: ghcr.io/${{ github.repository }}
          tags: |
            type=semver,pattern={{version}}
            type=semver,pattern={{major}}.{{minor}}
            type=raw,value=latest,enable={{is_default_branch}}

      - uses: docker/build-push-action@v6
        with:
          context: .
          platforms: linux/amd64,linux/arm64
          push: ${{ github.event_name != 'workflow_dispatch' }}
          tags: ${{ steps.meta.outputs.tags }}
          labels: ${{ steps.meta.outputs.labels }}
          cache-from: type=gha
          cache-to: type=gha,mode=max

  publish:
    name: Publish to crates.io
    runs-on: ubuntu-latest
    needs: [binaries, image]
    if: startsWith(github.ref, 'refs/tags/v')
    steps:
      - uses: actions/checkout@v5
      - uses: dtolnay/rust-toolchain@stable
      - uses: Swatinem/rust-cache@v2
      # One crate, so one publish. Owning the commit layer rather than forking
      # `iceberg-rust` is what keeps this possible at all — Cargo rejects git
      # dependencies on crates.io.
      - run: cargo publish --locked --all-features
        env:
          CARGO_REGISTRY_TOKEN: ${{ secrets.CARGO_REGISTRY_TOKEN }}

  release:
    name: GitHub release
    runs-on: ubuntu-latest
    needs: [binaries]
    if: startsWith(github.ref, 'refs/tags/v')
    steps:
      - uses: actions/download-artifact@v4
        with:
          path: artifacts
          merge-multiple: true
      - uses: softprops/action-gh-release@v2
        with:
          files: |
            artifacts/*.tar.gz
            artifacts/*.tar.gz.sha256
          generate_release_notes: true
