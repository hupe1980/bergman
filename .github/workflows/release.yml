name: Release

# Binaries, a container image and a crates.io publish, all from a tag.
#
# Three ways to get Bergman, and between them they cover everyone: a static
# musl binary for a Linux host, the container image for anything that runs
# containers, and `cargo install bergman` for a developer on any platform. That
# is why the binary matrix is Linux-only.
#
# Nothing here is cross-compiled or emulated. Each binary is built on a runner
# of its own architecture, and the image is assembled from those binaries rather
# than compiled again.
#
# **The job order is by increasing irreversibility**, and it is strictly serial:
#
#     verify -> binaries -> image -> crates.io -> GitHub release
#
# A GHCR tag can be deleted and a GitHub release can be deleted. **A crates.io
# version cannot** — the number is burned even after a yank — so it goes as late
# as possible, after everything that can still fail has not. The GitHub release
# is last because it is the announcement: it must not appear for a version whose
# image or crate never shipped.
#
# `verify` exists because `ci.yml` runs on branches and pull requests, not tags.
# Without it a tag pointing anywhere — an unmerged commit, a force-pushed ref —
# would publish untested code to a registry that never forgets.

on:
  push:
    tags: ["v*"]
  workflow_dispatch:

permissions:
  contents: write
  packages: write

env:
  CARGO_TERM_COLOR: always

jobs:
  # Runs against the tagged commit, which nothing else does. Not the full CI
  # matrix — that gates the merge — but the checks whose failure must stop a
  # release: the suite, the lints, and that the crate Cargo would collect is
  # complete and builds from the collected copy.
  verify:
    name: Verify the tag
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v5
      - uses: dtolnay/rust-toolchain@stable
        with:
          components: rustfmt, clippy
      - uses: Swatinem/rust-cache@v2
      - run: cargo fmt --all -- --check
      - run: cargo clippy --all-features --all-targets -- -D warnings
      - run: cargo test --all-features --locked
      # `cargo publish` verifies too, but only once it is already uploading.
      # This catches a crate missing a licence or a README before anything
      # irreversible happens.
      - run: cargo package --locked --all-features

  binaries:
    name: ${{ matrix.target }}
    runs-on: ${{ matrix.os }}
    needs: [verify]
    strategy:
      fail-fast: false
      matrix:
        # Each on a runner of its own architecture, so nothing is
        # cross-compiled or emulated. Linux is `musl`, statically linked, so one
        # artifact runs on any distribution; macOS arm64 exists for Homebrew.
        # No Windows binary (`cargo install bergman` covers it).
        include:
          - { target: x86_64-unknown-linux-musl, os: ubuntu-latest }
          - { target: aarch64-unknown-linux-musl, os: ubuntu-24.04-arm }
          - { target: aarch64-apple-darwin, os: macos-latest }
    steps:
      - uses: actions/checkout@v5
      - uses: dtolnay/rust-toolchain@stable
        with:
          targets: ${{ matrix.target }}
      - uses: Swatinem/rust-cache@v2

      # The musl C runtime and linker driver. The tree carries C dependencies —
      # aws-lc, ring, zstd, lzma, blake3 — compiled here rather than fetched, so
      # a musl target needs a musl toolchain even on a runner of the same
      # architecture. `cmake` and `pkg-config` are what aws-lc-sys reaches for;
      # they are preinstalled on the x86_64 runner images and named here anyway,
      # because the arm64 ones are slimmer.
      - name: Install musl toolchain
        if: runner.os == 'Linux'
        run: |
          sudo apt-get update -qq
          sudo apt-get install -y -qq musl-tools musl-dev cmake pkg-config

      # `--locked` so a release is built from exactly the dependency versions CI
      # tested, not whatever resolved today.
      - name: Build
        run: cargo build --release --locked --target ${{ matrix.target }} --all-features

      - name: Package
        shell: bash
        run: |
          name="bergman-${{ github.ref_name }}-${{ matrix.target }}"
          mkdir "$name"
          cp "target/${{ matrix.target }}/release/bergman" "$name/"
          cp README.md LICENSE-APACHE LICENSE-MIT bergman.example.toml "$name/"
          tar czf "$name.tar.gz" "$name"
          # A checksum beside each archive. macOS has `shasum`, not `sha256sum`;
          # both print the same `<hash>  <file>` line.
          shasum -a 256 "$name.tar.gz" > "$name.tar.gz.sha256"

      - uses: actions/upload-artifact@v4
        with:
          name: bergman-${{ matrix.target }}
          path: |
            *.tar.gz
            *.tar.gz.sha256

  image:
    name: Container image
    runs-on: ubuntu-latest
    # The binaries this image ships are the ones the job above already built,
    # rather than a third and fourth compile of the same source. That is worth
    # the serialisation: building arm64 from source here meant compiling the
    # whole dependency tree under QEMU.
    needs: [binaries]
    steps:
      - uses: actions/checkout@v5

      # No `setup-qemu-action`: the Dockerfile only copies files, so buildx
      # produces both platforms without executing anything for either.
      - uses: docker/setup-buildx-action@v3

      # Only the binary tarballs. An unfiltered download takes *every* artifact
      # the run has produced, which couples this job to artifacts it never asked
      # for — including the build record `build-push-action` uploads for itself.
      - uses: actions/download-artifact@v4
        with:
          pattern: bergman-*
          path: artifacts
          merge-multiple: true

      - name: Stage the binaries buildx will copy
        run: |
          mkdir -p dist
          # `TARGETARCH` in a Dockerfile is Docker's spelling, not Rust's.
          set -- "x86_64-unknown-linux-musl:amd64" "aarch64-unknown-linux-musl:arm64"
          for pair in "$@"; do
            target="${pair%:*}"; arch="${pair#*:}"
            tar xzf artifacts/bergman-*-"$target".tar.gz
            mv bergman-*-"$target"/bergman "dist/bergman-$arch"
          done
          chmod +x dist/*
          ls -l dist

      - uses: docker/login-action@v3
        with:
          registry: ghcr.io
          username: ${{ github.actor }}
          password: ${{ secrets.GITHUB_TOKEN }}

      - id: meta
        uses: docker/metadata-action@v5
        with:
          images: ghcr.io/${{ github.repository }}
          tags: |
            type=semver,pattern={{version}}
            type=semver,pattern={{major}}.{{minor}}
            # `is_default_branch` is never true here — this workflow only runs
            # on tags — so `latest` has to key off the tag itself. Excluded for
            # a pre-release (`v1.0.0-rc.1`), which must not become `latest`.
            type=raw,value=latest,enable=${{ !contains(github.ref_name, '-') }}

      - uses: docker/build-push-action@v6
        with:
          context: .
          platforms: linux/amd64,linux/arm64
          push: ${{ github.event_name != 'workflow_dispatch' }}
          tags: ${{ steps.meta.outputs.tags }}
          labels: ${{ steps.meta.outputs.labels }}
          cache-from: type=gha
          cache-to: type=gha,mode=max

  publish:
    name: Publish to crates.io
    runs-on: ubuntu-latest
    needs: [image]
    # The irreversible step. `workflow_dispatch` is a rehearsal — it builds and
    # verifies everything and publishes nothing — so it is excluded here as well
    # as from the image push. Testing the release path must never be able to
    # burn a version number.
    if: github.event_name != 'workflow_dispatch' && startsWith(github.ref, 'refs/tags/v')
    steps:
      - uses: actions/checkout@v5
      - uses: dtolnay/rust-toolchain@stable
      - uses: Swatinem/rust-cache@v2
      # One crate, so one publish. Owning the commit layer rather than forking
      # `iceberg-rust` is what keeps this possible at all — Cargo rejects git
      # dependencies on crates.io.
      - run: cargo publish --locked --all-features
        env:
          CARGO_REGISTRY_TOKEN: ${{ secrets.CARGO_REGISTRY_TOKEN }}

  release:
    name: GitHub release
    runs-on: ubuntu-latest
    # Last, and after the publish rather than beside it: this is the
    # announcement, and it must not exist for a version whose image or crate
    # never shipped.
    needs: [publish]
    if: github.event_name != 'workflow_dispatch' && startsWith(github.ref, 'refs/tags/v')
    steps:
      # Only the binary tarballs — the same filter as the image job, and for a
      # reason this job learned the hard way: downloading everything meant
      # fetching the `.dockerbuild` build record too, and a release failed when
      # that unrelated artifact would not download. A job should depend on the
      # artifacts it uses and no others.
      - uses: actions/download-artifact@v4
        with:
          pattern: bergman-*
          path: artifacts
          merge-multiple: true
      - uses: softprops/action-gh-release@v2
        with:
          files: |
            artifacts/*.tar.gz
            artifacts/*.tar.gz.sha256
          generate_release_notes: true

  # Homebrew: Formula/bergman.rb in hupe1980/homebrew-tap. Needs the `release`
  # environment with HOMEBREW_APP_ID and HOMEBREW_APP_PRIVATE_KEY: a GitHub App
  # installed on the tap only, with contents: write. Actions are pinned by
  # commit because this job holds that token.
  tap:
    name: Homebrew tap
    runs-on: ubuntu-latest
    needs: [release]
    if: github.event_name != 'workflow_dispatch' && startsWith(github.ref, 'refs/tags/v') && !contains(github.ref_name, '-')
    environment: release
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
      - uses: actions/download-artifact@9000827ccba6bdab643e8b6fd33ac0654aef8333 # v8.0.2
        with:
          pattern: bergman-*
          path: artifacts
          merge-multiple: true
      - uses: actions/create-github-app-token@64ab729a6294000f5aa4a4bc0b73d1f32bc45510 # v3.3.0
        id: app-token
        with:
          app-id: ${{ secrets.HOMEBREW_APP_ID }}
          private-key: ${{ secrets.HOMEBREW_APP_PRIVATE_KEY }}
          owner: hupe1980
          repositories: homebrew-tap
          permission-contents: write
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          repository: hupe1980/homebrew-tap
          token: ${{ steps.app-token.outputs.token }}
          path: tap
          persist-credentials: true
      - name: Update the formula
        run: |
          version="${GITHUB_REF_NAME#v}"
          mkdir -p tap/Formula
          cat artifacts/*.tar.gz.sha256 > checksums.txt
          packaging/homebrew/formula.sh "$version" checksums.txt > tap/Formula/bergman.rb
          cd tap
          if [ -n "$(git status --porcelain)" ]; then
            git config user.name "bergman release"
            git config user.email "bergman-release@users.noreply.github.com"
            git add Formula/bergman.rb
            git commit -m "bergman $version"
            git push
          fi

  # The published formula installs and passes its own test.
  brew:
    name: Homebrew install
    runs-on: macos-latest
    needs: [tap]
    steps:
      - run: |
          brew install hupe1980/tap/bergman
          brew test bergman
          [ "$(bergman --version)" = "bergman ${GITHUB_REF_NAME#v}" ]
