name: Release

# Binaries, a container image and a crates.io publish, all from a tag.
#
# Three ways to get Bergman, and between them they cover everyone: a static
# musl binary for a Linux host, the container image for anything that runs
# containers, and `cargo install bergman` for a developer on any platform. That
# is why the binary matrix is Linux-only.
#
# Nothing here is cross-compiled or emulated. Each binary is built on a runner
# of its own architecture, and the image is assembled from those binaries rather
# than compiled again.

on:
  push:
    tags: ["v*"]
  workflow_dispatch:

permissions:
  contents: write
  packages: write

env:
  CARGO_TERM_COLOR: always

jobs:
  binaries:
    name: ${{ matrix.target }}
    runs-on: ${{ matrix.os }}
    strategy:
      fail-fast: false
      matrix:
        # Linux only, and both on a runner of their own architecture — so
        # nothing is cross-compiled and nothing is emulated. GitHub's arm64
        # Linux runners are what make that possible; before them this needed
        # `cross`, whose last release still ships an Ubuntu 18.04 image too old
        # to run the host binaries a current Rust emits.
        #
        # `musl`, so the binaries are statically linked: no glibc version on the
        # host to match, and one artifact runs on anything.
        #
        # There is no macOS or Windows binary, and no gap where one would go.
        # Bergman is a server-side maintenance engine — its deployments are
        # cron, Kubernetes CronJobs, ECS and a daemon — and the two ways onto a
        # laptop are the container image below and `cargo install bergman`,
        # which works on every platform Rust does.
        include:
          - { target: x86_64-unknown-linux-musl, os: ubuntu-latest }
          - { target: aarch64-unknown-linux-musl, os: ubuntu-24.04-arm }
    steps:
      - uses: actions/checkout@v5
      - uses: dtolnay/rust-toolchain@stable
        with:
          targets: ${{ matrix.target }}
      - uses: Swatinem/rust-cache@v2

      # The musl C runtime and linker driver. The tree carries C dependencies —
      # aws-lc, ring, zstd, lzma, blake3 — compiled here rather than fetched, so
      # a musl target needs a musl toolchain even on a runner of the same
      # architecture. `cmake` and `pkg-config` are what aws-lc-sys reaches for;
      # they are preinstalled on the x86_64 runner images and named here anyway,
      # because the arm64 ones are slimmer.
      - name: Install musl toolchain
        run: |
          sudo apt-get update -qq
          sudo apt-get install -y -qq musl-tools musl-dev cmake pkg-config

      # `--locked` so a release is built from exactly the dependency versions CI
      # tested, not whatever resolved today.
      - name: Build
        run: cargo build --release --locked --target ${{ matrix.target }} --all-features

      - name: Package
        shell: bash
        run: |
          name="bergman-${{ github.ref_name }}-${{ matrix.target }}"
          mkdir "$name"
          cp "target/${{ matrix.target }}/release/bergman" "$name/"
          cp README.md LICENSE-APACHE LICENSE-MIT bergman.example.toml "$name/"
          tar czf "$name.tar.gz" "$name"
          # A checksum beside each archive, so a download can be verified
          # without trusting the transport. `sha256sum` because this matrix is
          # Linux; macOS ships `shasum` and no `sha256sum`, which is what broke
          # this the last time the matrix was wider.
          sha256sum "$name.tar.gz" > "$name.tar.gz.sha256"

      - uses: actions/upload-artifact@v4
        with:
          name: bergman-${{ matrix.target }}
          path: |
            *.tar.gz
            *.tar.gz.sha256

  image:
    name: Container image
    runs-on: ubuntu-latest
    # The binaries this image ships are the ones the job above already built,
    # rather than a third and fourth compile of the same source. That is worth
    # the serialisation: building arm64 from source here meant compiling the
    # whole dependency tree under QEMU.
    needs: [binaries]
    steps:
      - uses: actions/checkout@v5

      # No `setup-qemu-action`: the Dockerfile only copies files, so buildx
      # produces both platforms without executing anything for either.
      - uses: docker/setup-buildx-action@v3

      - uses: actions/download-artifact@v4
        with:
          path: artifacts
          merge-multiple: true

      - name: Stage the binaries buildx will copy
        run: |
          mkdir -p dist
          # `TARGETARCH` in a Dockerfile is Docker's spelling, not Rust's.
          set -- "x86_64-unknown-linux-musl:amd64" "aarch64-unknown-linux-musl:arm64"
          for pair in "$@"; do
            target="${pair%:*}"; arch="${pair#*:}"
            tar xzf artifacts/bergman-*-"$target".tar.gz
            mv bergman-*-"$target"/bergman "dist/bergman-$arch"
          done
          chmod +x dist/*
          ls -l dist

      - uses: docker/login-action@v3
        with:
          registry: ghcr.io
          username: ${{ github.actor }}
          password: ${{ secrets.GITHUB_TOKEN }}

      - id: meta
        uses: docker/metadata-action@v5
        with:
          images: ghcr.io/${{ github.repository }}
          tags: |
            type=semver,pattern={{version}}
            type=semver,pattern={{major}}.{{minor}}
            type=raw,value=latest,enable={{is_default_branch}}

      - uses: docker/build-push-action@v6
        with:
          context: .
          platforms: linux/amd64,linux/arm64
          push: ${{ github.event_name != 'workflow_dispatch' }}
          tags: ${{ steps.meta.outputs.tags }}
          labels: ${{ steps.meta.outputs.labels }}
          cache-from: type=gha
          cache-to: type=gha,mode=max

  publish:
    name: Publish to crates.io
    runs-on: ubuntu-latest
    needs: [binaries, image]
    if: startsWith(github.ref, 'refs/tags/v')
    steps:
      - uses: actions/checkout@v5
      - uses: dtolnay/rust-toolchain@stable
      - uses: Swatinem/rust-cache@v2
      # One crate, so one publish. Owning the commit layer rather than forking
      # `iceberg-rust` is what keeps this possible at all — Cargo rejects git
      # dependencies on crates.io.
      - run: cargo publish --locked --all-features
        env:
          CARGO_REGISTRY_TOKEN: ${{ secrets.CARGO_REGISTRY_TOKEN }}

  release:
    name: GitHub release
    runs-on: ubuntu-latest
    needs: [binaries]
    if: startsWith(github.ref, 'refs/tags/v')
    steps:
      - uses: actions/download-artifact@v4
        with:
          path: artifacts
          merge-multiple: true
      - uses: softprops/action-gh-release@v2
        with:
          files: |
            artifacts/*.tar.gz
            artifacts/*.tar.gz.sha256
          generate_release_notes: true
