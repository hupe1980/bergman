[package]
name = "bergman"
version = "0.5.0"
edition = "2024"
authors = ["hupe1980"]
description = "A Rust-native maintenance engine for Apache Iceberg — policy-driven compaction, snapshot expiration, and orphan cleanup with no JVM"
readme = "README.md"
keywords = ["bergman", "iceberg", "maintenance", "compaction", "lakehouse"]
categories = ["database", "command-line-utilities"]
license = "Apache-2.0 OR MIT"
repository = "https://github.com/hupe1980/bergman"
homepage = "https://hupe1980.github.io/bergman/"

# The floor `iceberg` 0.11.0 declares; `just msrv` checks it.
rust-version = "1.95"

# Optional dependencies are `dep:` so the feature surface is exactly this list.
# Embedders take `default-features = false` and add what they use.
[features]
default = ["cli", "catalog-rest", "compaction", "storage-all", "metrics"]

# The only operation that reads and writes data. DataFusion applies equality
# deletes as a hash anti-join; without the feature there is no compaction.
compaction = ["dep:datafusion"]

# The binary, terminal output and process concerns (logging, signals) the
# library leaves to its host.
cli = [
    "dep:clap",
    "dep:tracing-subscriber",
    "dep:comfy-table",
    "dep:humantime",
    "tokio/signal",
]

# The Iceberg REST catalog client.
catalog-rest = ["dep:iceberg-catalog-rest"]

# Each backend switches on in both clients: `iceberg-storage-opendal` for reads
# and writes, `opendal` for the listing orphan removal needs.
storage-s3 = ["iceberg-storage-opendal/opendal-s3", "opendal/services-s3"]
storage-gcs = ["iceberg-storage-opendal/opendal-gcs", "opendal/services-gcs"]
storage-azure = ["iceberg-storage-opendal/opendal-azdls", "opendal/services-azdls"]
storage-all = ["storage-s3", "storage-gcs", "storage-azure"]

# Prometheus metrics, and the `/metrics`, `/health` and `/events` endpoint.
metrics = ["dep:prometheus-client", "dep:axum"]

[[bin]]
name = "bergman"
path = "src/main.rs"
required-features = ["cli"]

[lib]
name = "bergman"
path = "src/lib.rs"

[dependencies]

# The library runs on the caller's runtime; only the binary builds one.
tokio = { version = "1", features = ["rt-multi-thread", "macros", "sync", "time"] }
async-trait = "0.1"
futures = { version = "0.3", default-features = false, features = ["std", "async-await"] }

# Iceberg. Cloud object stores come from `iceberg-storage-opendal`, which keeps
# the build rustls-only.
iceberg = "0.11"
iceberg-catalog-rest = { version = "0.11", optional = true }
iceberg-storage-opendal = { version = "0.11", default-features = false, features = [
    "opendal-memory",
    "opendal-fs",
] }

# Object listing, which `FileIO` lacks. The same version `iceberg-storage-opendal`
# uses, so the tree holds one copy.
opendal = { version = "0.58", default-features = false, features = [
    "services-memory",
    "services-fs",
] }

# Bergman's own REST client for commits and the OAuth2 exchange. rustls only, so
# the musl build stays static.
reqwest = { version = "0.13", default-features = false, features = [
    "rustls",
    "json",
    "form",
] }

# Version-matched to `iceberg` so the tree holds one arrow and one parquet.
arrow = { version = "58", default-features = false }

parquet = "58"

# Equality-delete anti-join and spilling sort (feature `compaction`).
datafusion = { version = "54", optional = true }

# TOML configuration; JSON for audit records and `--format json`.
serde = { version = "1", features = ["derive"] }
serde_json = "1"
toml = "1"

# Table patterns, compiled once.
globset = "0.4"

chrono = { version = "0.4", features = ["serde"] }
thiserror = "2"
uuid = { version = "1", features = ["v4", "serde"] }
humantime-serde = "1"

# Maintenance windows in the operator's time zone.
chrono-tz = "0.10"

# Validates a rule's `schedule` at startup.
cron = "0.15"

# The library emits spans and never installs a subscriber.
tracing = "0.1"

prometheus-client = { version = "0.24", optional = true }

# The daemon's HTTP endpoints.
axum = { version = "0.8", default-features = false, features = [
    "http1",
    "tokio",
    "json",
], optional = true }

clap = { version = "4", features = ["derive", "env"], optional = true }
tracing-subscriber = { version = "0.3", features = ["env-filter", "json"], optional = true }
comfy-table = { version = "7", optional = true }

# Parses `--interval 15m`, the vocabulary the policy file uses.
humantime = { version = "2", optional = true }

[dev-dependencies]
tokio = { version = "1", features = ["full", "test-util"] }

# Drives the HTTP router in-process.
tower = { version = "0.5", default-features = false, features = ["util"] }
tempfile = "3"
async-trait = "0.1"
futures = { version = "0.3", default-features = false, features = ["std"] }
uuid = { version = "1", features = ["v4"] }

# The test fixture writes v3 deletion vectors by hand, because `iceberg` 0.11.0
# has no writer for them. Both crates are already in the tree through `iceberg`.
roaring = "0.11"
crc32fast = "1"

# Line tables only: full debug info across DataFusion, Arrow and aws-lc in every
# test binary outgrows a hosted runner's disk. `CARGO_PROFILE_DEV_DEBUG=full`
# for a debugger.
[profile.dev]
debug = "line-tables-only"

[profile.release]
lto = "thin"
codegen-units = 1
strip = "symbols"
